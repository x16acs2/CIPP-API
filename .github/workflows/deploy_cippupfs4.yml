# Deploys CIPP-API to CloudHost's Function App (cippupfs4)
name: Deploy CIPP-API to cippupfs4

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  deploy:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Build and stage modules
        shell: pwsh
        run: ./Tools/Build-DevApiModules.ps1

      - name: Deploy to Azure Function App
        uses: Azure/functions-action@v1
        with:
          app-name: "cippupfs4"
          slot-name: "Production"
          package: "."
          publish-profile: ${{ secrets.AZURE_PUBLISHPROFILE_CIPPUPFS4 }}
